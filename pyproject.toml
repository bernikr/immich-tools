[project]
name = "immich-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "apscheduler>=4.0.0a6",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "prek>=0.5.7",
  "ruff>=0.17.2",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D",                   # pydocstyle
  "CPY",                 # flake8-copyright
  "T20",                 # flake8-print
  "missing-todo-author",
  "missing-todo-link",
  "line-contains-todo",
  "logging-f-string",
]

[tool.mypy]
strict = true
allow_redefinition = true
allow_redefinition_new = true
local_partial_types = true
